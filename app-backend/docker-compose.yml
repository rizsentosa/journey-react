services:
  postgres-db:
    image: postgres:latest
    ports:
      - "5439:5432"
    environment:
      POSTGRES_USER: "dev"
      POSTGRES_PASSWORD: "postgres123"
      POSTGRES_DB: "app_db"
    volumes:
      - postgres-journey_react_data_db:/var/lib/postgresql
volumes:
  postgres-journey_react_data_db:
